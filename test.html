<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Track player test</title>
	<style>
		button { display: block; width: 100%; text-align: left; margin: 2px 0; font-family: monospace; }
		h3 { margin: 10px 0 2px; }
	</style>
</head>
<body>
	<h3>Basic Waltz Phrase (I-IV-V-I)</h3>
	<button id="waltz">Play</button>

	<h3>Jingle Bells (first segment)</h3>
	<button id="jingleBells">Play</button>

	<h3>Portnoy Tribute (7/8)</h3>
	<button id="portnoy">Play</button>

	<h3>Looney Tunes Theme (melody only)</h3>
	<button id="looneyTunes">Play</button>

	<h3>Mario Theme (melody only)</h3>
	<button id="mario">Play</button>

	<div id="status">not started</div>

	<script type="module">
		import { ABCFormat } from '/core/abc.js';
		import { Tracker } from '/core/tracker.js';

		const status = document.getElementById('status');
		let context = null;

		function bind(id, path) {
			document.getElementById(id).addEventListener('click', async () => {
				if (!context) {
					context = new AudioContext();
				}
				const track = await ABCFormat.load(path);
				new Tracker(track).play(context);
				status.textContent = `played ${id}`;
			});
		}

		bind('waltz', 'tunes/waltz.abc');
		bind('jingleBells', 'tunes/jingle.abc');
		bind('portnoy', 'tunes/portnoy.abc');
		bind('looneyTunes', 'tunes/looney.abc');
		bind('mario', 'tunes/mario.abc');
	</script>
</body>
</html>
