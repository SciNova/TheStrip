<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script type="text/javascript" src="note.js"></script>
	<script type="text/javascript" src="instrument.js"></script>
	<script type="text/javascript" src="track.js"></script>
	<script type="text/javascript" src="pattern.js"></script>
	<script type="text/javascript" src="song.js"></script>
	<script type="text/javascript" src="mod-loader.js"></script>
	<script type="text/javascript" src="s3m-loader.js"></script>
	<script type="text/javascript" src="mixer.js"></script>
	<script type="text/javascript" src="tracker.js"></script>
	<script type="text/javascript" src="mixer-view.js"></script>
	<script type="text/javascript" src="main.js"></script>
	<style type="text/css">
		body {
			background: #111;
			color: #eee;
			font-family: sans-serif;
			text-align: center;
		}

		canvas {
			width: 100%;
			height: 128px;
			background: #000;
		}

		.row {
			margin: 1em auto;
			padding: 0.75em;
			max-width: 480px;
			border: 1px solid #333;
		}

		button {
			font-size: 1.2em;
			padding: 0.5em 1.5em;
			margin-top: 0.5em;
		}

		select {
			font-size: 1em;
			padding: 0.3em;
		}
	</style>
</head>
<body>
	<canvas id="visualizer" width="512" height="128"></canvas>

	<div class="row">
		<select id="track1"></select>
		<br>
		<button class="play1" onclick="toggleTrack(1)">Play</button>
	</div>

	<div class="row">
		<select id="track2"></select>
		<br>
		<button class="play2" onclick="toggleTrack(2)">Play</button>
	</div>
</body>
</html>
