{% extends "base.html" %}

{% block content %}
	<div id="strip"></div>
	<div id="controller"></div>
	<div id="debug"></div>
	<script src="/game.js"></script>
	<script src="/js/{{ game_js }}.js"></script>
	<script>
		function toggleFullscreen() {
			if (!document.fullscreenElement && !document.webkitFullscreenElement && 
				!document.mozFullScreenElement && !document.msFullscreenElement) {
				const element = document.documentElement;
				if (element.requestFullscreen) element.requestFullscreen();
			} else {
				if (document.exitFullscreen) document.exitFullscreen();
			}
		}
		document.addEventListener('DOMContentLoaded', function() {
			document.addEventListener('keydown', function(e) {
				if (e.key === 'F11') {
					e.preventDefault();
					toggleFullscreen();
				}
			});
			const stripContainer = document.getElementById('strip');
			const controllerContainer = document.getElementById('controller');
			const debugContainer = document.getElementById('debug');
			const gameClass = window['{{ game_class }}'];
			new GameController(stripContainer, controllerContainer, debugContainer, gameClass, {fps: 30});

			function handleFullscreenChange() {
				window.dispatchEvent(new Event('resize'));
			}
			document.addEventListener('fullscreenchange', handleFullscreenChange);
		});
	</script>
{% endblock %}
