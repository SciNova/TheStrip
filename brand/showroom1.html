<!DOCTYPE html>
<html>
<head>
	<title>S1 Box Showroom</title>
	<style>
		body { margin: 0; background-color: #000; overflow: hidden; }
		canvas { display: block; }
	</style>
</head>
<body>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<script>
		const scene = new THREE.Scene();
		const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
		const renderer = new THREE.WebGLRenderer({ antialias: true });
		renderer.setSize(window.innerWidth, window.innerHeight);
		document.body.appendChild(renderer.domElement);

		const loader = new THREE.TextureLoader();
		const topTex = loader.load('top.jpg');
		
		const createSideMaterial = (offset) => {
			const tex = loader.load('side.jpg');
			tex.repeat.set(0.25, 1);
			tex.offset.set(offset, 0);
			return new THREE.MeshStandardMaterial({ map: tex });
		};

		const materials = [
			createSideMaterial(0.0),  // Right
			createSideMaterial(0.75), // Left
			new THREE.MeshStandardMaterial({ map: topTex }), // Top
			new THREE.MeshStandardMaterial({ color: 0x000000 }), // Bottom
			createSideMaterial(0.25), // Front
			createSideMaterial(0.5)   // Back
		];

		const geometry = new THREE.BoxGeometry(20, 2.8, 20);
		const box = new THREE.Mesh(geometry, materials);
		scene.add(box);

		const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
		scene.add(ambientLight);

		const pointLight = new THREE.PointLight(0xffffff, 1);
		pointLight.position.set(20, 30, 20);
		scene.add(pointLight);

		camera.position.set(25, 20, 25);
		camera.lookAt(0, 0, 0);

		function animate() {
			requestAnimationFrame(animate);
			box.rotation.y += 0.005;
			renderer.render(scene, camera);
		}

		window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		});

		animate();
	</script>
</body>
</html>
