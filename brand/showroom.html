<!DOCTYPE html>
<html>
<head>
	<><meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Strip Box Showroom</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			background-color: #1a1a1a;
			font-family: sans-serif;
			height: 100vh;
			overflow: hidden;
		}
		
		#controls {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 60px;
			background: rgba(30, 30, 30, 0.9);
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 20px;
			z-index: 100;
			backdrop-filter: blur(10px);
		}
		
		.control-btn {
			color: white;
			background: transparent;
			border: 1px solid #444;
			padding: 8px 16px;
			border-radius: 4px;
			cursor: pointer;
			font-size: 14px;
			transition: all 0.2s ease;
		}
		
		.control-btn:hover {
			background: rgba(255, 255, 255, 0.1);
		}
		
		.control-btn.active {
			background: rgba(30, 80, 120, 0.8);
			border-color: #4a9;
		}
		
		#scene-container {
			position: fixed;
			top: 60px;
			left: 0;
			width: 100%;
			height: calc(100vh - 60px);
		}
		
		canvas {
			display: block;
			width: 100%;
			height: 100%;
		}
		
		#size-label {
			position: fixed;
			bottom: 20px;
			left: 50%;
			transform: translateX(-50%);
			color: white;
			background: rgba(0, 0, 0, 0.7);
			padding: 10px 20px;
			border-radius: 8px;
			font-size: 16px;
			z-index: 50;
		}
	</style>
</head>
<body>
	<!-- Control buttons -->
	<div id="controls">
		<button class="control-btn active" data-size="20" data-label="S1 Strip (0.83m)">S1</button>
		<button class="control-btn" data-size="28" data-label="S2 Strip (2.0m)">S2</button>
		<button class="control-btn" data-size="36" data-label="S4 Strip (4.0m)">S4</button>
	</div>
	
	<!-- Single scene container -->
	<div id="scene-container"></div>
	
	<!-- Current size label -->
	<div id="size-label">S1 Strip (0.83m)</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
	
	<script>
		// Global variables
		let scene, camera, renderer, controls, box;
		let currentBoxSize = 20;
		
		// Initialize the scene
		function init() {
			const container = document.getElementById('scene-container');
			
			// Scene setup
			scene = new THREE.Scene();
			scene.background = new THREE.Color(0x1a1a1a);
			
			// Camera setup
			camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
			camera.position.set(35, 25, 35);
			
			// Renderer setup
			renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setSize(container.clientWidth, container.clientHeight);
			container.appendChild(renderer.domElement);
			
			// Controls setup
			controls = new THREE.OrbitControls(camera, renderer.domElement);
			controls.enableDamping = true;
			controls.dampingFactor = 0.05;
			
			// Lighting
			const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
			scene.add(ambientLight);
			
			const pointLight1 = new THREE.PointLight(0xffffff, 1.2);
			pointLight1.position.set(30, 40, 30);
			scene.add(pointLight1);
			
			const pointLight2 = new THREE.PointLight(0xffffff, 0.8);
			pointLight2.position.set(-30, -10, -30);
			scene.add(pointLight2);
			
			// Create initial box
			createBox(currentBoxSize);
			
			// Start animation loop
			animate();
			
			// Handle window resize
			window.addEventListener('resize', onWindowResize);
			
			// Set up button click handlers
			setupButtonHandlers();
		}
		
		// Create or update box with given size
		function createBox(size) {
			// Remove existing box if present
			if (box) {
				scene.remove(box);
				// Dispose of old geometry
				box.geometry.dispose();
			}
			
			// Texture loader
			const loader = new THREE.TextureLoader();
			const topTex = loader.load('S1.jpg');
			
			// Function to create side material with offset
			const createSideMaterial = (offset) => {
				const tex = loader.load('side.jpg');
				tex.repeat.set(0.25, 1);
				tex.offset.set(offset, 0);
				return new THREE.MeshStandardMaterial({ 
					map: tex,
					roughness: 0.1,
					metalness: 0.4,
					emissive: 0xffffff,
					emissiveMap: tex,
					emissiveIntensity: 0.6
				});
			};
			
			// Materials for the box
			const materials = [
				createSideMaterial(0.0),
				createSideMaterial(0.75),
				new THREE.MeshStandardMaterial({ map: topTex, roughness: 0.2, metalness: 0.3 }),
				new THREE.MeshStandardMaterial({ color: 0x000000 }),
				createSideMaterial(0.25),
				createSideMaterial(0.5)
			];
			
			// Create box with given size
			const geometry = new THREE.BoxGeometry(size, 2.8, size);
			box = new THREE.Mesh(geometry, materials);
			scene.add(box);
			
			// Update camera position based on box size
			const cameraDistance = size * 1.5;
			camera.position.set(cameraDistance, size * 0.7, cameraDistance);
			controls.update();
		}
		
		// Set up button click handlers
		function setupButtonHandlers() {
			const buttons = document.querySelectorAll('.control-btn');
			const sizeLabel = document.getElementById('size-label');
			
			buttons.forEach(button => {
				button.addEventListener('click', () => {
					// Remove active class from all buttons
					buttons.forEach(btn => btn.classList.remove('active'));
					
					// Add active class to clicked button
					button.classList.add('active');
					
					// Get box size from data attribute
					const size = parseFloat(button.getAttribute('data-size'));
					const label = button.getAttribute('data-label');
					
					// Update current box
					currentBoxSize = size;
					createBox(size);
					
					// Update label
					sizeLabel.textContent = label;
				});
			});
		}
		
		// Animation loop
		function animate() {
			requestAnimationFrame(animate);
			controls.update();
			renderer.render(scene, camera);
		}
		
		// Handle window resize
		function onWindowResize() {
			const container = document.getElementById('scene-container');
			camera.aspect = container.clientWidth / container.clientHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(container.clientWidth, container.clientHeight);
		}
		
		// Start everything
		init();
	</script>
</body>
</html>
